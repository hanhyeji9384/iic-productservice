              <span class="product-history-copy">

                <span>at Samsung.com</span>
                <span class="muted">Limited warranty, expires September 30, 2027</span>
                <span class="muted">Parts retention period, expires August 31, 2029</span>

            </span>
          </button>

            <span class="product-history-visual" aria-hidden="true">
              <img src="./assets/product-gelati.png" alt="">
            </span>
            <span class="product-history-info">
              <strong>Rococo 02</strong>
              <span class="product-history-copy">

                <span>Purchased on May 12, 2026</span>

                <span class="muted">Limited warranty, expires May 31, 2028</span>

          <button class="product-history-item product-selectable" type="button">

        <section class="manual-entry-prompt" aria-label="구매 이력 직접 입력 안내">
          <h2>구매 이력이 조회되지 않나요?</h2>
          <p>제품명, 구매 정보를 직접 입력하고 구매 증빙 이미지를 필수 첨부해 주세요.</p>
          <button id="manual-entry-open" type="button">직접 입력하기</button>
        </section>

        <section class="manual-entry-panel hidden" aria-label="구매 이력 직접 입력">
          <div class="manual-entry-header">
            <h2>구매 이력이 조회되지 않는 경우, 제품 정보를 직접 입력해 주세요.</h2>
            <button id="manual-entry-close" type="button">직접 입력 닫기</button>
          </div>
          <div class="manual-entry-form">
            <div class="manual-entry-field wide searchable-field">
              <label for="manual-product-name">제품명*</label>
              <input id="manual-product-name" type="text" placeholder="제품명을 검색하세요" autocomplete="off">
              <div class="manual-suggestion-list" aria-label="제품명 검색 결과">
                <button type="button">Gelati 01</button>
                <button type="button">HYPEOB-01</button>
                <button type="button">Smart Breezeby 01</button>
              </div>
            </div>
            <label class="manual-entry-field">
              <span>시리얼 넘버</span>
              <input id="manual-serial-number" type="text" placeholder="ex) GE240612-00003821">
            </label>
            <label class="manual-entry-field">
              <span>구매일*</span>
              <input class="manual-date-input" type="date" required>
            </label>
            <div class="manual-entry-field wide searchable-field">
              <label for="manual-purchase-store">구매처*</label>
              <input id="manual-purchase-store" type="text" placeholder="구매처를 검색하세요" autocomplete="off">
              <div class="manual-suggestion-list" aria-label="구매처 검색 결과">
                <button type="button">하우스 도산 · 서울</button>
                <button type="button">젠틀몬스터 홍대 · 서울</button>
                <button type="button">젠틀몬스터 부산 신세계 · 부산</button>
              </div>
            </div>
            <div class="manual-entry-field wide manual-upload-field">
              <p>구매 증빙 이미지를 첨부해 주세요.</p>
              <input id="manual-proof-upload" type="file" accept="image/*" multiple>
              <button id="manual-proof-upload-button" type="button">UPLOAD AN IMAGE</button>
              <div id="manual-proof-upload-list" class="manual-upload-list" aria-label="첨부된 구매 증빙"></div>
            </div>
          </div>
        </section>

      </div>

      <div class="request-actions">
        <button class="button secondary" type="button" id="prev-button">GO BACK</button>
        <button class="button primary" type="button" id="next-button">CONTINUE</button>
      </div>
